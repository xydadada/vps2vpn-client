name: vps2vpn Android

# The universal APK, signed with the release key (secrets ANDROID_KEYSTORE_*),
# then driven on an emulator by .github/scripts/android-e2e.sh. With "publish"
# it also gets the update signature and goes up as the pre-release
# test-android-<version>; it joins a release only by hand.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Sign the APK for updates and upload it as the pre-release test-android-<version>'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.50.0'
  GO_VERSION: '1.27.4'
  RUST_VERSION: '1.99.0'
  NDK_VERSION: r28c

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
    outputs:
      version: ${{ steps.name.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-3-dev

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            plugins/rust_api/rust
            services/helper

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true
          link-to-sdk: true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Flutter dependencies
        run: |
          flutter --version
          flutter pub get

      - name: Fetch CA certificates
        env:
          CA_BUNDLE: cacert-2026-09-25.pem
          CA_BUNDLE_SHA256: a41b5d356aea97a529fe27e0f7316d2f9d946d75927476cf9cf1b90637d00505
        run: |
          bundle=core/Clash.Meta/component/ca/ca-certificates.crt
          curl -fsSL --retry 3 -o "$bundle" "https://curl.se/ca/$CA_BUNDLE"
          echo "$CA_BUNDLE_SHA256  $bundle" | sha256sum -c -

      - name: Release signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          [ -n "$KEYSTORE_B64" ] || { echo 'secret ANDROID_KEYSTORE_B64 is not set' >&2; exit 1; }
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 -d > android/app/keystore.jks
          # flutter pub get leaves local.properties without a final newline.
          {
            echo
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
          } >> android/local.properties

      - name: vps2vpn tests
        run: flutter test test/vps2vpn

      - name: Package
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          VPS2VPN_RELEASE_SIGNING: required
        run: |
          show() { ls -l android/app/keystore.jks || true; echo "local.properties keys: $(cut -d= -f1 android/local.properties 2>/dev/null | paste -sd' ')"; }
          show
          dart tool/package.dart android --arch universal --env stable -v
          show

      - name: Name the APK for the panel
        id: name
        run: |
          set -euo pipefail
          ver=$(sed -nE 's/^version:[[:space:]]*([0-9.]+).*/\1/p' pubspec.yaml | head -1)
          apk=$(find dist -name '*.apk' | head -1)
          [ -n "$apk" ] || { echo 'no APK in dist/' >&2; exit 1; }
          mkdir -p release
          cp "$apk" "release/vps2vpn-$ver-android-universal.apk"
          echo "VERSION=$ver" >> "$GITHUB_ENV"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          ls -l release

      - name: Check the APK signature
        run: |
          set -euo pipefail
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          out=$("$apksigner" verify --verbose --print-certs "release/vps2vpn-$VERSION-android-universal.apk")
          printf '%s\n' "$out" | grep -E 'Verified using|certificate (DN|SHA-256)' || true
          grep -q 'CN=vps2vpn' <<< "$out" \
            || { echo 'the APK is not signed with the vps2vpn release key' >&2; printf '%s\n' "$out" | head -20 >&2; exit 1; }

      - name: Remove the signing key
        if: always()
        run: rm -f android/app/keystore.jks android/local.properties

      - name: Sign and upload the pre-release
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          [ -n "$SIGNING_KEY" ] || { echo 'secret UPDATE_SIGNING_KEY is not set' >&2; exit 1; }
          key="$RUNNER_TEMP/update-key.pem"
          trap 'rm -f "$key"' EXIT
          umask 077
          printf '%s\n' "$SIGNING_KEY" > "$key"
          want=$(grep -oE "[0-9a-f]{64}" lib/vps2vpn/update_signing.dart | head -1)
          have=$(openssl pkey -in "$key" -pubout -outform DER | tail -c 32 | od -An -tx1 | tr -d ' \n')
          [ "$want" = "$have" ] || { echo 'UPDATE_SIGNING_KEY is not the key the app trusts' >&2; exit 1; }
          cd release
          file="vps2vpn-$VERSION-android-universal.apk"
          sha256sum "$file" > SHA256SUMS-android.txt
          bash ../tool/sign_update.sh -k "$key" "$file"
          rm -f "$key"
          gh release create "test-android-$VERSION" --repo "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" \
            --title "test android $VERSION" --notes 'Pre-release for the automated APK check. Not for users.' \
            "$file" "$file.sig" SHA256SUMS-android.txt

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: vps2vpn-android
          path: release/*.apk
          retention-days: 7

  emulator:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout the test scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - name: Download the APK
        uses: actions/download-artifact@v4
        with:
          name: vps2vpn-android
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install, import, connect (end to end)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash .github/scripts/android-e2e.sh "$(ls apk/*.apk | head -1)" android-e2e

      - name: Upload results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: android-e2e
          path: android-e2e
          if-no-files-found: ignore
