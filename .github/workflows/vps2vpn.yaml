name: vps2vpn Windows

# Builds the Windows installer, then installs it on the throwaway runner and
# checks the takeover end to end (see .github/scripts/takeover-e2e.ps1).
# The upstream release workflows are removed: they publish to FlClash channels.
# Run by hand only: a full build from source takes ~30 minutes. The quick
# check of an installer built elsewhere is e2e.yaml.
# With "publish", a build that passed its checks is signed with the update key
# (secret UPDATE_SIGNING_KEY) and uploaded as the pre-release test-<version>.
# It becomes the latest release only by hand, after e2e.yaml passes on it.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Sign the installers and upload them as the pre-release test-<version>'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.50.0'
  GO_VERSION: '1.27.4'

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 90
    permissions:
      contents: write   # only the publish step uses it
    steps:
      - name: Enable git long paths
        run: git config --global core.longpaths true

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            plugins/rust_api/rust
            services/helper

      - name: Verify and apply pinned Mihomo concurrency fixes
        shell: bash
        run: |
          go run tool/apply_core_patches.go
          go run tool/apply_core_patches.go

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Flutter dependencies
        run: |
          flutter --version
          flutter pub get

      - name: Fetch CA certificates
        shell: bash
        env:
          CA_BUNDLE: cacert-2026-09-25.pem
          CA_BUNDLE_SHA256: a41b5d356aea97a529fe27e0f7316d2f9d946d75927476cf9cf1b90637d00505
        run: |
          bundle=core/Clash.Meta/component/ca/ca-certificates.crt
          curl -fsSL --retry 3 -o "$bundle" "https://curl.se/ca/$CA_BUNDLE"
          echo "$CA_BUNDLE_SHA256  $bundle" | sha256sum -c -

      - name: vps2vpn tests
        run: flutter test test/vps2vpn

      - name: Package
        run: dart tool/package.dart windows --env stable -v

      - name: Check DLL load flags
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist -Filter 'vps2vpn-*-windows-amd64-portable.zip' | Select-Object -First 1
          if (-not $zip) { throw 'No Windows amd64 portable zip found in dist/' }
          python -I tool/check_load_flags.py $zip.FullName
          if ($LASTEXITCODE -ne 0) { throw 'A System32-only binary imports a DLL that ships only with the app' }

      - name: Name the installer for the panel
        shell: pwsh
        run: |
          $match = Select-String pubspec.yaml -Pattern '^version:\s*([0-9.]+)' | Select-Object -First 1
          if (-not $match) { throw 'Failed to parse version from pubspec.yaml' }
          $ver = $match.Matches[0].Groups[1].Value
          $src = Get-ChildItem dist -Filter 'vps2vpn-*-windows-amd64-setup.exe' | Select-Object -First 1
          if (-not $src) { throw 'No Windows amd64 setup installer found in dist/' }
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item $src.FullName "release/vps2vpn-$ver-windows-amd64-setup.exe"
          $zip = Get-ChildItem dist -Filter 'vps2vpn-*-windows-amd64-portable.zip' | Select-Object -First 1
          if ($zip) { Copy-Item $zip.FullName "release/vps2vpn-$ver-windows-amd64-portable.zip" }
          "VERSION=$ver" >> $env:GITHUB_ENV
          Get-ChildItem release

      - name: Record build inputs
        shell: pwsh
        run: |
          $modules = @(git submodule status --recursive)
          $trackedChanges = @(git status --porcelain --untracked-files=no)
          $ca = Get-FileHash core/Clash.Meta/component/ca/ca-certificates.crt -Algorithm SHA256
          $artifacts = @(Get-ChildItem dist, release -File -Recurse | ForEach-Object {
            @{ path = [IO.Path]::GetRelativePath((Get-Location).Path, $_.FullName); sha256 = (Get-FileHash $_.FullName -Algorithm SHA256).Hash }
          })
          $record = @{
            source_commit = (git rev-parse HEAD)
            submodules = $modules
            tracked_changes = $trackedChanges
            go = (go version)
            rust = (rustc --version)
            flutter = ((flutter --version --machine) | ConvertFrom-Json)
            ca_bundle_sha256 = $ca.Hash
            artifacts = $artifacts
          }
          $record | ConvertTo-Json -Depth 8 | Set-Content dist/build-inputs.json -Encoding utf8

      - name: Install and take over (end to end)
        shell: pwsh
        run: |
          $setup = (Get-ChildItem release -Filter '*-windows-amd64-setup.exe' | Select-Object -First 1).FullName
          if ([string]::IsNullOrWhiteSpace($setup)) { throw 'No Windows amd64 setup installer found in release/' }
          ./.github/scripts/takeover-e2e.ps1 -Setup $setup -Out e2e

      - name: Sign and upload the pre-release
        if: ${{ inputs.publish }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          [ -n "$SIGNING_KEY" ] || { echo "secret UPDATE_SIGNING_KEY is not set" >&2; exit 1; }
          key="$RUNNER_TEMP/update-key.pem"
          trap 'rm -f "$key"' EXIT
          umask 077
          printf '%s\n' "$SIGNING_KEY" > "$key"
          # The app only takes signatures from the key built into it.
          want=$(grep -oE "[0-9a-f]{64}" lib/vps2vpn/update_signing.dart | head -1)
          have=$(openssl pkey -in "$key" -pubout -outform DER | tail -c 32 | od -An -tx1 | tr -d ' \n')
          [ "$want" = "$have" ] || { echo "UPDATE_SIGNING_KEY is not the key the app trusts" >&2; exit 1; }
          cd release
          files=(vps2vpn-$VERSION-windows-amd64-setup.exe vps2vpn-$VERSION-windows-amd64-portable.zip)
          sha256sum "${files[@]}" > SHA256SUMS.txt
          bash ../tool/sign_update.sh -k "$key" "${files[@]}"
          rm -f "$key"
          # A rerun replaces its own test pre-release; anything else by that name stops it.
          tag="test-$VERSION"
          if pre=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isPrerelease -q .isPrerelease 2>/dev/null); then
            [ "$pre" = true ] || { echo "$tag exists and is not a pre-release" >&2; exit 1; }
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag -y
          elif gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag"
          fi
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" \
            --title "test $VERSION" --notes "Pre-release for the automated installer check. Not for users." \
            "${files[@]}" "${files[@]/%/.sig}" SHA256SUMS.txt

      - name: Upload installer
        # The account's artifact storage can be full; results are in the log too.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: vps2vpn-windows
          path: |
            release
            dist/*.zip
            dist/build-inputs.json
          if-no-files-found: ignore

      - name: Upload end-to-end results
        if: always()
        # The account's artifact storage can be full; results are in the log too.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: e2e
          path: e2e
          if-no-files-found: ignore
