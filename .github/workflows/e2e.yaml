name: vps2vpn installer check

# Installs an installer that was already built (attached to a release of this
# repository) on a throwaway Windows runner and checks the takeover end to
# end. No build here, so it takes a few minutes.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag that carries the setup .exe
        required: true
        default: v1.0.0

permissions:
  contents: read

jobs:
  e2e:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Checkout the test script
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - name: Download the installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release download -R "$env:GITHUB_REPOSITORY" -p '*-setup.exe' -D installer -- "$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw 'Release installer download failed' }
          Get-ChildItem installer

      - name: Install and take over (end to end)
        shell: pwsh
        run: |
          $setups = @(Get-ChildItem installer -Filter '*.exe')
          if ($setups.Count -ne 1) { throw 'Expected exactly one release installer' }
          ./.github/scripts/takeover-e2e.ps1 -Setup $setups[0].FullName -Out e2e

      - name: Upload results
        if: always()
        # The account's artifact storage can be full; results are in the log too.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: e2e
          path: e2e
          if-no-files-found: ignore
