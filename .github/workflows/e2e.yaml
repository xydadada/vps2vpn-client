name: vps2vpn installer check

# Installs an installer that was already built (attached to a release of this
# repository) on throwaway Windows runners and checks the takeover end to
# end. No build here, so it takes a few minutes.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag that carries the setup .exe
        required: true
        default: v1.0.33
      from:
        description: Older releases to update from in the app's way, comma separated; latest = the current latest release (empty = skip)
        required: false
        default: latest
      legend:
        description: Old release a user upgrades from by running the new setup by hand (empty = skip)
        required: false
        default: v1.0.27

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      from: ${{ steps.from.outputs.list }}
    steps:
      - id: from
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          FROM: ${{ inputs.from }}
        run: |
          set -euo pipefail
          latest=$(gh release view -R "$REPO" --json tagName -q .tagName)
          list=$(printf '%s' "$FROM" | tr ', ' '\n\n' | sed '/^$/d' | sed "s/^latest$/$latest/" \
            | { grep -vxF "$TAG" || true; } | sort -u | jq -R . | jq -sc .)
          echo "list=$list" >> "$GITHUB_OUTPUT"
          echo "update from: $list"

  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout the test script
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - name: Download the installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          gh release download -R $env:REPO -p '*-windows-amd64-setup.exe' -D installer -- $env:TAG
          Get-ChildItem installer

      - name: Install and take over (end to end)
        shell: pwsh
        run: |
          $setup = (Get-ChildItem installer -Filter '*-windows-amd64-setup.exe' | Select-Object -First 1).FullName
          if ([string]::IsNullOrWhiteSpace($setup)) { throw 'No Windows amd64 setup installer found in installer/' }
          ./.github/scripts/takeover-e2e.ps1 -Setup $setup -Out e2e

      - name: Upload results
        if: always()
        # The account's artifact storage can be full; results are in the log too.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.os }}
          path: e2e
          if-no-files-found: ignore

  legend:
    # Must pass before a release becomes the latest (legend-upgrade-e2e.ps1).
    if: ${{ inputs.legend != '' }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Checkout the test script
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - name: Download both installers and FlClash
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          FROM: ${{ inputs.legend }}
          REPO: ${{ github.repository }}
        run: |
          gh release download -R $env:REPO -p '*-windows-amd64-setup.exe' -D old -- $env:FROM
          gh release download -R $env:REPO -p '*-windows-amd64-setup.exe' -D new -- $env:TAG
          gh release download -R chen08209/FlClash -p 'FlClash-0.9.4-windows-amd64-portable.zip' -D dl -- v0.9.4
          $zip = 'dl/FlClash-0.9.4-windows-amd64-portable.zip'
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne '8fab8ab4edead33a6c6d4f249fd90a287acbf66a99cc5bd207fcfc034f3b1224') { throw "FlClash zip sha256 $hash" }
          New-Item -ItemType Directory -Force tools | Out-Null
          Move-Item $zip tools/flclash.zip
          Get-ChildItem old, new, tools

      - name: Upgrade by hand (end to end)
        shell: pwsh
        run: |
          $old = (Get-ChildItem old -Filter '*-windows-amd64-setup.exe' | Select-Object -First 1).FullName
          $new = (Get-ChildItem new -Filter '*-windows-amd64-setup.exe' | Select-Object -First 1).FullName
          ./.github/scripts/legend-upgrade-e2e.ps1 -Old $old -New $new -Tools tools -Out legend

      - name: Upload results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: legend-${{ matrix.os }}
          path: legend
          if-no-files-found: ignore

  upgrade:
    # The in-app update: an older release running, the new setup started the
    # way CommonAction.installUpdate starts it (see .github/scripts/upgrade-e2e.ps1).
    needs: plan
    if: ${{ needs.plan.outputs.from != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
        from: ${{ fromJSON(needs.plan.outputs.from) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout the test script
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - name: Download both installers
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          FROM: ${{ matrix.from }}
          REPO: ${{ github.repository }}
        run: |
          gh release download -R $env:REPO -p '*-windows-amd64-setup.exe' -D old -- $env:FROM
          gh release download -R $env:REPO -p '*-windows-amd64-setup.exe' -D new -- $env:TAG
          Get-ChildItem old, new

      - name: Update in place (end to end)
        shell: pwsh
        run: |
          $old = (Get-ChildItem old -Filter '*-windows-amd64-setup.exe' | Select-Object -First 1).FullName
          $new = (Get-ChildItem new -Filter '*-windows-amd64-setup.exe' | Select-Object -First 1).FullName
          ./.github/scripts/upgrade-e2e.ps1 -Old $old -New $new -Out upgrade

      - name: Upload results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: upgrade-${{ matrix.os }}-${{ matrix.from }}
          path: upgrade
          if-no-files-found: ignore

  gate:
    # A release becomes the latest only when this passes: the install, the
    # legend upgrade and the in-app update all ran and passed, none skipped.
    needs: [plan, e2e, legend, upgrade]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - env:
          E2E: ${{ needs.e2e.result }}
          LEGEND: ${{ needs.legend.result }}
          UPGRADE: ${{ needs.upgrade.result }}
          FROM: ${{ needs.plan.outputs.from }}
          OLD: ${{ inputs.legend }}
        run: |
          echo "install: $E2E"
          echo "legend from ${OLD:-nothing}: $LEGEND"
          echo "update from $FROM: $UPGRADE"
          [ "$E2E" = success ] && [ "$LEGEND" = success ] && [ "$UPGRADE" = success ] || {
            echo "not a release gate: every check must run and pass" >&2
            exit 1
          }
