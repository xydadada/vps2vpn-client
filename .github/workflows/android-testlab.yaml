name: vps2vpn Android on real phones

# Firebase Test Lab (project in vars.GCP_PROJECT_ID, keyless sign-in through
# workload identity). The emulator froze once the app's VPN came up, on every
# API and stack, while a bare tunnel did not; this asks real phones.
# The subscription comes from secrets.TESTLAB_SUB_URL (a test account on the
# test server) and is handed over hex-encoded; nothing prints it.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Pre-release holding the Android APK
        default: test-android-1.0.26
      devices:
        description: "gcloud --device values, separated by ';', e.g. model=SC-51E,version=36;model=CPH2449,version=34 (empty = only build and list the models; phones use the free daily quota)"
        default: ''

permissions:
  contents: read
  id-token: write

jobs:
  testlab:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Keep the project out of the log
        env:
          PROJECT: ${{ vars.GCP_PROJECT_ID }}
        run: '[ -z "$PROJECT" ] || echo "::add-mask::$PROJECT"'

      - name: Checkout the driver
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/testlab

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check that diagnostic summaries hide subscription values
        run: python3 -m unittest discover -s .github/testlab -p '*_test.py' -v

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.0'

      - name: Build the driver
        working-directory: .github/testlab
        run: gradle --no-daemon assembleDebug assembleDebugAndroidTest

      - name: Download the APK
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p '*-android-universal.apk' -D apk

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_TESTLAB_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Physical phones on offer
        env:
          PROJECT: ${{ vars.GCP_PROJECT_ID }}
        run: |
          gcloud firebase test android models list --project "$PROJECT" \
            --filter='form=PHYSICAL' --format='table(id,brand,name,supportedVersionIds.list())' || true

      - name: Install, import, connect on real phones
        if: inputs.devices != ''
        env:
          PROJECT: ${{ vars.GCP_PROJECT_ID }}
          SUB: ${{ secrets.TESTLAB_SUB_URL }}
          DEVICES: ${{ inputs.devices }}
        run: |
          set -o pipefail
          [ -n "$SUB" ] || { echo 'secret TESTLAB_SUB_URL is not set' >&2; exit 1; }
          hex=$(printf '%s' "$SUB" | xxd -p | tr -d '\n')
          echo "::add-mask::$hex"
          echo "::add-mask::$(python3 -I -c 'import sys, urllib.parse; print(urllib.parse.urlsplit(sys.argv[1]).hostname or "")' "$SUB")"
          args=()
          IFS=';' read -ra devices <<< "$DEVICES"
          for d in "${devices[@]}"; do args+=(--device "$d"); done
          gcloud firebase test android run --project "$PROJECT" --type instrumentation \
            --app .github/testlab/driver/build/outputs/apk/debug/driver-debug.apk \
            --test .github/testlab/driver/build/outputs/apk/androidTest/debug/driver-debug-androidTest.apk \
            --additional-apks "$(ls apk/*.apk | head -1)" \
            --environment-variables "sub=$hex" \
            --timeout 8m --num-flaky-test-attempts 0 --no-record-video --no-performance-metrics \
            --results-dir "vps2vpn-android/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --results-history-name vps2vpn-android "${args[@]}" 2>&1 | tee testlab.log

      # Raw results stay in the project's bucket; only a scrubbed summary leaves it.
      - name: What each phone saw
        if: always() && inputs.devices != ''
        env:
          SUB: ${{ secrets.TESTLAB_SUB_URL }}
        run: |
          bucket=$(grep -oE 'storage/browser/[^/]+/' testlab.log | head -1 | cut -d/ -f3)
          [ -n "$bucket" ] || { echo 'no results bucket in the log'; exit 0; }
          mkdir -p raw
          gcloud storage cp -r "gs://$bucket/vps2vpn-android/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/*" raw/ || true
          for dir in raw/*/; do
            [ -d "$dir" ] || continue
            name=$(basename "$dir")
            python3 -I .github/testlab/summary.py "$dir" > "summary-$name.txt"
            echo "== $name"
            cat "summary-$name.txt"
          done

      - name: Upload the summary
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: testlab
          path: |
            testlab.log
            summary-*.txt
          if-no-files-found: ignore
