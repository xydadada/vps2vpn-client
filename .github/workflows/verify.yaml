name: Source verification

on:
  push:
    branches: [vps2vpn, audit/2026-11-reliability-security]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.27.4'
  FLUTTER_VERSION: '3.50.0'
  CA_BUNDLE: cacert-2026-09-25.pem
  CA_BUNDLE_SHA256: a41b5d356aea97a529fe27e0f7316d2f9d946d75927476cf9cf1b90637d00505

jobs:
  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum
      - name: Prepare verified Core sources
        run: |
          bundle=core/Clash.Meta/component/ca/ca-certificates.crt
          curl -fsSL --retry 3 -o "$bundle" "https://curl.se/ca/$CA_BUNDLE"
          echo "$CA_BUNDLE_SHA256  $bundle" | sha256sum -c -
          go run tool/apply_core_patches.go
      - name: Test and check the Go wrapper
        working-directory: core
        run: |
          CGO_ENABLED=0 go test -tags=with_gvisor ./...
          go test -race -tags=with_gvisor ./...
          go vet -tags=with_gvisor ./...
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -tags=with_gvisor -o "$RUNNER_TEMP/vps2vpnCore.exe" ./cmd/core

  dart:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Linux native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-3-dev libsecret-1-dev
          pkg-config --exists gtk+-3.0
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustup default 1.99.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            plugins/rust_api/rust
            services/helper
      - name: Dependencies and analysis
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('pubspec.yaml')
          content = path.read_text()
          needle = '    setup:\n      build_assets: true'
          if content.count(needle) != 1:
              raise SystemExit('Cannot locate the setup hook configuration')
          path.write_text(content.replace(needle, '    setup:\n      build_assets: false'))
          PY
          flutter pub get --enforce-lockfile
          flutter analyze --no-fatal-infos
      - name: Root tests and coverage
        run: dart run tool/test.dart -- --reporter expanded --coverage
      - name: Bundled plugin checks
        run: bash tool/check_plugins.sh
      - name: Pure Dart build hook tests
        working-directory: plugins/setup/setup_hooks
        run: |
          dart pub get --enforce-lockfile
          dart analyze
          dart test --reporter expanded
      - name: Save coverage and test report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: dart-test-evidence
          path: |
            coverage/lcov.info
            .dart_tool/test_bundles/report.json
          if-no-files-found: warn

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux native build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-3-dev libsecret-1-dev
          pkg-config --exists gtk+-3.0
      - name: Install the pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustup default 1.99.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            plugins/rust_api/rust
            services/helper
      - name: Test Rust API and helper
        shell: bash
        run: |
          cargo test --locked --manifest-path plugins/rust_api/rust/Cargo.toml
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cargo test --locked --manifest-path services/helper/Cargo.toml --features windows-service
          else
            cargo test --locked --manifest-path services/helper/Cargo.toml
          fi
